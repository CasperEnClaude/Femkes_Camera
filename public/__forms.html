<!doctype html>
<html lang="nl">
<head><meta charset="utf-8" /><title>Netlify form detection</title></head>
<body>
  <!-- Statische kopie van het boekingsformulier zodat Netlify het betrouwbaar
       detecteert en registreert (nodig voor Netlify Forms). Niet zichtbaar voor bezoekers. -->
  <form name="boeking" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="boeking" />
    <input name="bot-field" />
    <input type="text" name="naam" />
    <input type="email" name="email" />
    <input type="tel" name="telefoon" />
    <input type="text" name="dier" />
    <input type="text" name="pakket" />
    <input type="text" name="periode" />
    <input type="text" name="locatie" />
    <textarea name="bericht"></textarea>
    <input type="checkbox" name="toestemming_publicatie" />
    <input type="checkbox" name="herinnering" />
  </form>
</body>
</html>
