# Netlify-configuratie voor Femke's Camera
# Astro bouwt een statische site; Netlify serveert de map 'dist'.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Nette caching voor geoptimaliseerde afbeeldingen (Astro hasht bestandsnamen).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Zorg dat het CMS-inlogscherm altijd werkt.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
